[project]
name = "sentiment"
version = "1.0.0"
description = "Live nuclear-energy sentiment pipeline: collectors, scorer, and read API for the AIMS dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.20.1",
    "sqlalchemy>=2.1.6",
    "httpx>=0.27",
    "websockets>=17.3",
    "pydantic-settings>=2.16.2",
    "sentry-sdk>=2.73.0",
]

[project.optional-dependencies]
# The scorer is the only service that needs the model runtime.
# torch is installed separately from the CPU wheel index (see Dockerfile).
scorer = ["transformers>=5.21.1", "torch>=2.15.0"]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1", "ruff>=0.17.3", "respx>=0.21"]

[project.scripts]
sentiment = "sentiment.cli:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentiment*"]

[tool.setuptools.package-data]
sentiment = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Old collector folders now only hold local legacy data (and the retired Threads scraper).
extend-exclude = ["guardian", "mastodon", "newyorktimes", "threads", "youtube", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # random is used for jitter, not crypto
    "S608",   # SQL is composed from fixed fragments only; values are always bound
    "RUF001", # typographic characters appear in real post text fixtures
    "SIM105", # try/except/pass reads clearer than contextlib.suppress around awaits
    "SIM905", # word lists read better as one split string
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
