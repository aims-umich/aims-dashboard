name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs this through deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dashboard_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/constraints.txt }
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dashboard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard
      ENABLED_SOURCES: bluesky,mastodon,youtube,guardian,nyt
      LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/constraints.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start the API on seeded demo data
        working-directory: backend
        run: |
          pip install -c constraints.txt -e .
          sentiment migrate
          sentiment seed-demo
          nohup sentiment api > api.log 2>&1 &
          for _ in $(seq 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/e2e/.results
            backend/api.log
          retention-days: 7

  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the app image (the scorer image is built on deploy)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: app
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=app
