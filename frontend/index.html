<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live public sentiment toward nuclear energy across Bluesky, Mastodon, YouTube, and the news, from the AIMS Lab at the University of Michigan."
    />
    <meta name="theme-color" content="#111827" />
    <title>Nuclear Energy Sentiment · AIMS Lab</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        const saved = localStorage.getItem("darkMode")
        const dark = saved != null ? JSON.parse(saved) : matchMedia("(prefers-color-scheme: dark)").matches
        if (dark) document.documentElement.classList.add("dark")
      } catch {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
