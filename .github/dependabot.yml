version: 2
updates:
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react (needed for JSX-aware unused-variable checks) supports ESLint 9 at most.
      - { dependency-name: eslint, versions: [">=10"] }
      - { dependency-name: "@eslint/js", versions: [">=10"] }
    groups:
      # Vite and its plugins must move together (peer ranges), so update them in one PR.
      vite: { patterns: [vite, "@vitejs/*", "@tailwindcss/*", tailwindcss] }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # transformers 5.x (the scorer) requires huggingface-hub < 2.
      - { dependency-name: huggingface-hub, versions: [">=2"] }
      # sympy (a torch dependency) requires mpmath < 1.4.
      - { dependency-name: mpmath, versions: [">=1.4"] }
      # pydantic pins pydantic-core exactly; it updates when pydantic does.
      - { dependency-name: pydantic-core }
  - { package-ecosystem: docker, directory: /backend, schedule: { interval: monthly } }
