<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live public sentiment toward nuclear energy across Bluesky, Mastodon, YouTube, and the news, from the AIMS Lab at the University of Michigan."
    />
    <meta name="theme-color" content="#080C11" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews. Crawlers do not run JavaScript, so every page shares this card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nuclear Sentiment Analysis" />
    <meta property="og:title" content="Nuclear Sentiment Analysis · AIMS Lab" />
    <meta
      property="og:description"
      content="Live public sentiment toward nuclear energy across Bluesky, Mastodon, YouTube, and the news, from the AIMS Lab at the University of Michigan."
    />
    <meta property="og:url" content="https://dashboard.aims-umich.com/" />
    <meta property="og:image" content="https://dashboard.aims-umich.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nuclear Sentiment Analysis, AIMS Lab, University of Michigan" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Nuclear Sentiment Analysis · AIMS Lab</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong one.
      try {
        const saved = localStorage.getItem("theme")
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
        document.documentElement.dataset.theme = theme
      } catch {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
